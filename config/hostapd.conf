driver=nl80211
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0
beacon_int=100
auth_algs=1
wpa_key_mgmt=WPA-PSK
ssid=RaspAP
channel=1
hw_mode=g
wpa_passphrase=ChangeMe
interface=wlan0
wpa=2
wpa_pairwise=CCMP
country_code=GB
## Rapberry Pi 3 specific to on board WLAN/WiFi
#ieee80211n=1 # 802.11n support (Raspberry Pi 3)
#wmm_enabled=1 # QoS support (Raspberry Pi 3)
#ht_capab=[HT40][SHORT-GI-20][DSSS_CCK-40] # (Raspberry Pi 3)

## RaspAP wireless client AP mode
#interface=uap0

## RaspAP bridge AP mode, disabled by default
#bridge=br0

## May yield better results with Mac clients, comment out corresponding lines above
#hw_mode=a
#channel=36
#ieee80211n=1
#ieee80211ac=1
#ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]
#vht_oper_chwidth=1
#vht_oper_centr_freq_seg0_idx=42
#vht_capab=[MAX-AMSDU-7935][SHORT-GI-80]
